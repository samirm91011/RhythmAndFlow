# Production stack for a single Linux server (xneelo Cloud, Ubuntu 24.04):
#   Caddy (automatic HTTPS)  ->  API (ASP.NET Core container)  ->  PostgreSQL
# Secrets live in /opt/rhythmflow/.env on the server (never in git). See docs/XNEELO-SETUP.md.
name: rhythmflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rhythmflow
      POSTGRES_USER: rfadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Small footprint settings so the database fits comfortably on a 2 GB server.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfadmin -d rhythmflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 350m

  api:
    image: ${API_IMAGE:-ghcr.io/samirm91011/rhythmflow-api:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=db;Port=5432;Database=rhythmflow;Username=rfadmin;Password=${DB_PASSWORD};SSL Mode=Disable
      # Keep .NET's memory use modest and return unused memory to the system.
      DOTNET_GCHeapHardLimit: "0x20000000"      # 512 MB
      DOTNET_GCConserveMemory: "5"
      DOTNET_TieredPGO: "0"
    healthcheck:
      # bash is needed for /dev/tcp (the default shell, dash, does not have it)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    mem_limit: 700m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 100m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
