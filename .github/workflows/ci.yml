name: CI

# Runs on every pull request and on pushes to develop and feature branches.
# A failing build or test blocks the merge (see docs/GITHUB-SETUP.md for the branch rules).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, "feature/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/RhythmFlow.sln

      - name: Build
        run: dotnet build backend/RhythmFlow.sln --no-restore -c Release

      - name: Test
        run: dotnet test backend/RhythmFlow.sln --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: backend/**/TestResults/*.trx

  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Lint (reports only, does not block yet)
        run: ./gradlew :app:lintDebug --no-daemon
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
